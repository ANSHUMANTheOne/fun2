<html>

<head>

<title>Reaction time Game</title>

</head>

<body>

<h2>Reaction time Game</h2>

<p>click the box when it says CLICK. The red box will show up randomly within the enclosed area!</p>

<button onclick="

document.getElementById('message').innerHTML='wait...';

document.getElementById('box').style.display='none';

setTimeout('document.getElementById(\'message\').innerHTML=\'CLICK!\'; document.getElementById(\'box\').style.display=\'block\'; document.getElementById(\'box\').style.left=Math.random()*500+\'px\'; document.getElementById(\'box\').style.top=Math.random()*250+\'px\'; startTime=new Date().getTime()', Math.random()*2000+1000);

">

click to start

</button>

<br>
<br>

<p id="message">click the button to start</p>

<div id="game" style="width:600px;height:350px;border:2px solid black;position:relative;">

<div id="box"

style="width:60px;height:60px;background:red;position:absolute;display:none;"

onclick="

time=new Date().getTime()-startTime;

document.getElementById('result').innerHTML='Your time: '+time+' ms';

document.getElementById('box').style.display='none';

if(time<best){

best=time;

document.getElementById('best').innerHTML='best time: '+best+' ms';

}

">

</div>

</div>

<p id="result">Your time:</p>

<p id="best">best time:</p>

<script>

startTime=0;

time=0;

best=99999;

</script>

</body>

</html>
